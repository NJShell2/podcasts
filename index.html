var box = document.getElementById("cats");
CATS.forEach(function (cat) {
  var sec = document.createElement("section");
  sec.className = "cat";
  var h = document.createElement("h2");
  h.textContent = cat.title;
  var b = document.createElement("p");
  b.className = "blurb";
  b.textContent = cat.blurb;
  sec.appendChild(h);
  sec.appendChild(b);
  cat.episodes.forEach(function (ep) {
    var slug = ep.file.split("/").pop().replace(/\.mp3$/, "");
    var el = document.createElement("div");
    el.className = "episode";
    el.id = "ep-" + slug;
    var h3 = document.createElement("h3");
    h3.textContent = ep.title;
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = ep.date + "  |  " + ep.duration;
    var desc = document.createElement("p");
    desc.className = "desc";
    desc.textContent = ep.desc;
    var audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "metadata";
    audio.src = ep.file;
    var share = document.createElement("button");
    share.className = "share";
    share.type = "button";
    share.textContent = "Copy link to this episode";
    share.addEventListener("click", function () {
      var link = "https://njshell2.github.io/podcasts/#" + slug;
      function done(ok) {
        share.textContent = ok ? "Copied!" : "Copy failed";
        setTimeout(function () { share.textContent = "Copy link to this episode"; }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () { done(true); }, function () { done(false); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = link;
        document.body.appendChild(ta);
        ta.select();
        try { done(document.execCommand("copy")); } catch (e) { done(false); }
        document.body.removeChild(ta);
      }
    });
    el.appendChild(h3);
    el.appendChild(meta);
    el.appendChild(desc);
    el.appendChild(audio);
    el.appendChild(share);
    sec.appendChild(el);
  });
  box.appendChild(sec);
});

// Deep-linking: #slug scrolls to the episode, flashes it, and adds a
// large one-tap play button (browsers block autoplay with sound, so this
// is the closest equivalent: one tap starts playback as a user gesture).
function revealFromHash() {
  var m = /^#([A-Za-z0-9-]+)$/.exec(location.hash || "");
  if (!m) return;
  var target = document.getElementById("ep-" + m[1]);
  if (!target) return;
  target.scrollIntoView({ block: "center" });
  target.classList.remove("flash");
  void target.offsetWidth;
  target.classList.add("flash");
  setTimeout(function () { target.classList.remove("flash"); }, 2500);
  var audio = target.querySelector("audio");
  if (audio && !target.querySelector(".big-play")) {
    var big = document.createElement("button");
    big.className = "big-play";
    big.type = "button";
    big.textContent = "\u25B6 Play this episode";
    big.addEventListener("click", function () {
      var p = audio.play();
      if (p && typeof p.catch === "function") { p.catch(function () {}); }
    });
    audio.addEventListener("play", function () { big.remove(); }, { once: true });
    target.insertBefore(big, target.firstChild);
  }
}
window.addEventListener("hashchange", revealFromHash);
revealFromHash();
